name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build application
        run: dotnet build src/NowThenNext/NowThenNext.csproj

      # Tests disabled - uncomment to re-enable
      # - name: Build tests
      #   run: dotnet build tests/NowThenNext.Tests.E2E/NowThenNext.Tests.E2E.csproj
      #
      # - name: Install Playwright browsers
      #   run: pwsh tests/NowThenNext.Tests.E2E/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium
      #
      # - name: Run E2E tests
      #   run: dotnet test tests/NowThenNext.Tests.E2E/NowThenNext.Tests.E2E.csproj --no-build

      - name: Publish
        run: dotnet publish src/NowThenNext/NowThenNext.csproj -c Release -o release --nologo

      - name: Inject Google OAuth client id
        env:
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
        run: |
          if [ -z "$GOOGLE_CLIENT_ID" ]; then
            echo "::error::GOOGLE_CLIENT_ID repository variable is not set"
            exit 1
          fi
          sed -i "s|REPLACE_WITH_YOUR_CLIENT_ID.apps.googleusercontent.com|$GOOGLE_CLIENT_ID|" release/wwwroot/js/googleAuth.js
          if grep -q "REPLACE_WITH_YOUR_CLIENT_ID" release/wwwroot/js/googleAuth.js; then
            echo "::error::CLIENT_ID placeholder was not replaced in googleAuth.js"
            exit 1
          fi

      - name: Prepare GitHub Pages
        run: |
          sed -i 's|<base href="/" />|<base href="/NowNextThen/" />|g' release/wwwroot/index.html
          touch release/wwwroot/.nojekyll
          cp release/wwwroot/index.html release/wwwroot/404.html

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: release/wwwroot
